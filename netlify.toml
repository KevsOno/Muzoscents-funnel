[build]
  # Change the publish directory to point to the new website folder
  publish = "KevsDigital"
  # If you don't need the old function build anymore, you can remove the command line below.
  # If you do, leave it as is.
  command = "cd netlify/functions && npm install || echo 'No dependencies to install'"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# IMPORTANT: We removed the redirect that sent "/" to "/bisignin.html".
# Now, when someone visits the site root, Netlify will correctly serve "KevsDigital/index.html".

[[redirects]]
  from = "/bizintel"
  to = "/bizintel.html"
  status = 200
