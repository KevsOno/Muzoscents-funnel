[build]
  # Publish directory pointing to the website folder
  publish = "KevsDigital"
  # Install Netlify function dependencies (safe no-op if none exist)
  command = "cd netlify/functions && npm install || echo 'No dependencies to install'"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    # Added CSP, COOP, and CORP for A+ Security
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# IMPORTANT: We removed the redirect that sent "/" to "/bisignin.html".
# Now, when someone visits the site root, Netlify will correctly serve "KevsDigital/index.html".

[[redirects]]
  from = "/bizintel"
  to = "/bizintel.html"
  status = 200
