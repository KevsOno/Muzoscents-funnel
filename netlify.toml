[build]
  command = "cd netlify/functions && npm install || echo 'No dependencies to install'"
  publish = "."

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Rewrite / to /bisignin.html (keep URL as /)
[[redirects]]
  from = "/"
  to = "/bisignin.html"
  status = 200
